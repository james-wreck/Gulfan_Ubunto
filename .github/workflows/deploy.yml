
name: Deploy Flutter Web to AWS Lightsail

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: my_first_flutter_app
        run: flutter pub get

      # 4. Build Flutter Web
      - name: Build Flutter Web
        working-directory: my_first_flutter_app
        run: flutter build web --release

      # 5. Configure SSH
      - name: Configure SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_SSH_KEY"

          mkdir -p ~/.ssh

          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail_key

          chmod 600 ~/.ssh/lightsail_key

          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      # 6. Prepare Lightsail directory
      - name: Prepare server directory
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USERNAME }}
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo install -d -o ubuntu -g www-data -m 0755 /var/www/html"

      # 7. Deploy Flutter Web files
      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USERNAME }}
        run: |
          rsync -avz --delete \
            --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/lightsail_key" \
            my_first_flutter_app/build/web/ \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/var/www/html/"

      # 8. Test and reload Nginx
      - name: Reload Nginx
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USERNAME }}
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo nginx -t &&
             sudo systemctl reload nginx"
